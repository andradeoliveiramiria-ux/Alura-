<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rua Sustentável | Pomar Urbano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <nav aria-label="Navegação Principal">
            <div class="logo">BioRua</div>
            <div class="accessibility-controls">
                <button onclick="changeFontSize('increase')" aria-label="Aumentar fonte">A+</button>
                <button onclick="changeFontSize('decrease')" aria-label="Diminuir fonte">A-</button>
                <button id="contrast-toggle" aria-label="Alternar Alto Contraste">🌓</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="reveal">
            <h1>Semeando o Futuro nas Cidades</h1>
            <p>Conheça as árvores frutíferas que transformarão nossa rua em um ecossistema vivo.</p>
        </section>

        <section id="catalogo" class="reveal">
            <h2>Nossas Espécies</h2>
            <div id="tree-grid" class="tree-grid"></div>
        </section>

        <section id="info-tecnica" class="reveal">
            <h2>Guia de Plantio e Cuidados</h2>
            <div class="accordion-container" id="care-accordion">
                </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Projeto Rua Sustentável. Focado em Acessibilidade.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
